<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inn Menu Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #cfc2a5;
  --page: #f5eedb;
  --page-warm: #efe6cd;
  --ink: #2c2216;
  --ink-soft: #5c5140;
  --ink-faint: #8f8471;
  --rule: #d8cba9;
  --rubric: #9e2b25;
  --rubric-soft: #b5554a;
  --rubric-ink: #f7efdd;
  --spine: linear-gradient(90deg, rgba(60,40,10,0) 0%, rgba(60,40,10,0.14) 46%, rgba(60,40,10,0.22) 50%, rgba(60,40,10,0.14) 54%, rgba(60,40,10,0) 100%);
  --book-shadow: 0 4px 10px rgba(50,35,10,0.2), 0 22px 60px rgba(50,35,10,0.28);
  color-scheme: light;
  --serif: "EB Garamond", Georgia, serif;
  --fell: "IM Fell English", "EB Garamond", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="dark"] {
  --desk: #12100b;
  --page: #241f14;
  --page-warm: #1d1910;
  --ink: #e9dcc0;
  --ink-soft: #b3a68a;
  --ink-faint: #7d7360;
  --rule: #453c28;
  --rubric: #d96f52;
  --rubric-soft: #b25a44;
  --rubric-ink: #211208;
  --spine: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 46%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0.4) 54%, rgba(0,0,0,0) 100%);
  --book-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 22px 60px rgba(0,0,0,0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--serif); font-size: 18px; line-height: 1.5;
  min-height: 100vh; min-height: 100dvh;
  transition: background 0.25s ease, color 0.25s ease;
}
a { color: var(--rubric); } a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }

.theme-toggle {
  position: fixed; top: 0.9rem; right: 0.9rem; z-index: 40;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--page); color: var(--ink); border: 1px solid var(--rule);
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.theme-toggle:hover { border-color: var(--rubric); color: var(--rubric); }
.theme-toggle svg { width: 18px; height: 18px; display: block; }
.theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

.wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: flex-start; justify-content: center; padding: 3rem 2rem 4rem; }
.book {
  position: relative; width: 100%; max-width: 1060px;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--page); border-radius: 4px 10px 10px 4px;
  box-shadow: var(--book-shadow); border: 1px solid var(--rule);
}
.book::before { content: ""; position: absolute; inset: 0 auto 0 50%; width: 90px; transform: translateX(-50%); background: var(--spine); pointer-events: none; z-index: 2; }

.page-l, .page-r { padding: 2.75rem 2.75rem 2.5rem; min-width: 0; }
.page-l { background: var(--page-warm); border-radius: 4px 0 0 4px; }
.page-r { border-radius: 0 10px 10px 0; }

/* ---------- left page: parameters ---------- */
.page-head { margin-bottom: 1.5rem; }
.page-l h1 { font-family: var(--fell); font-weight: 400; font-size: 1.7rem; line-height: 1.1; margin: 0 0 0.15rem; }
.tagline { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rubric); margin: 0; }
.page-head::after { content: ""; display: block; margin-top: 0.9rem; border-top: 1px solid var(--rule); }
fieldset { border: none; padding: 0; margin: 0; }
.register-line {
  display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 0.6rem;
  padding: 0.35rem 0; border-bottom: 1px solid var(--rule);
}
.register-line label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--rubric);
}
select, input[type="text"] {
  width: 100%; padding: 0.35rem 0.15rem; background: transparent;
  border: none; border-radius: 0;
  font-family: var(--serif); font-size: 16px; color: var(--ink);
}
select:focus, input[type="text"]:focus { outline: none; box-shadow: 0 1px 0 var(--rubric); }
/* Native dropdown popups don't inherit page styles; pair with color-scheme
   above so the popup itself is readable in both themes. */
select option { background: var(--page); color: var(--ink); }
select option:disabled { color: var(--ink-faint); }
.lock-btn {
  width: 32px; height: 32px; background: transparent; border: none; padding: 0; cursor: pointer;
  color: var(--ink-faint); display: inline-flex; align-items: center; justify-content: center;
}
.lock-btn:hover { color: var(--ink-soft); }
.lock-btn svg { width: 14px; height: 14px; display: block; }
.lock-btn .icon-locked { display: none; }
.lock-btn[aria-pressed="true"] { color: var(--rubric); }
.lock-btn[aria-pressed="true"] .icon-locked { display: block; }
.lock-btn[aria-pressed="true"] .icon-unlocked { display: none; }
.packs-head {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--rubric); margin: 1.1rem 0 0.2rem;
}
.flavor-packs { display: flex; flex-direction: column; }
.flavor-pack-row {
  display: flex; align-items: center; gap: 0.6rem; cursor: pointer; min-height: 34px;
  font-size: 1rem; color: var(--ink); border-bottom: 1px solid var(--rule);
}
.flavor-pack-row input { accent-color: var(--rubric); width: 15px; height: 15px; cursor: pointer; }
.button-row { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
.button-row + .button-row { margin-top: 0.5rem; }
.btn {
  flex: 1; padding: 0.55rem 0.5rem; min-height: 42px;
  background: transparent; color: var(--ink); border: 1px solid var(--ink-soft); border-radius: 2px;
  font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px;
  cursor: pointer; transition: all 0.15s ease;
}
.btn:hover { border-color: var(--rubric); color: var(--rubric); }
.btn.primary { background: var(--rubric); border-color: var(--rubric); color: var(--rubric-ink); }
.btn.primary:hover { filter: brightness(1.1); color: var(--rubric-ink); }
.polish-block { margin-top: 1.5rem; padding-top: 1.1rem; border-top: 1px solid var(--rule); }
.polish-block .register-line { grid-template-columns: 96px 1fr; }
.polish-block p { margin: 0.5rem 0 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em; color: var(--ink-soft); line-height: 1.6; }
#polish-status { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-top: 0.4rem; min-height: 1em; }
.footnote { margin-top: 1.4rem; font-family: var(--mono); font-size: 10px; letter-spacing: 0.02em; color: var(--ink-faint); line-height: 1.6; }

/* ---------- right page: the menu ---------- */
.menu-header { text-align: center; margin-bottom: 1.9rem; }
.menu-header .incipit {
  font-variant: small-caps; letter-spacing: 0.3em; font-size: 0.8rem;
  color: var(--rubric); margin: 0 0 0.85rem;
}
.menu-header h2 { font-family: var(--fell); font-weight: 400; font-size: 2.6rem; line-height: 1.05; margin: 0 0 0.5rem; }
.menu-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
.menu-header::after { content: ""; display: block; margin-top: 1.1rem; border-top: 1px solid var(--rule); }
.event-note { text-align: center; font-style: italic; color: var(--rubric); margin: 0 auto 0.55rem; font-size: 0.98rem; text-wrap: balance; }
.event-note::before { content: "\00B6\2002"; font-style: normal; color: var(--rubric-soft); }
.section-heading {
  font-family: var(--fell); font-weight: 400; font-size: 1.4rem;
  text-align: center; color: var(--ink); margin: 2.1rem 0 0.7rem;
}
.section-heading .versal { color: var(--rubric); font-size: 1.25em; line-height: 1; }
.dish-list { list-style: none; padding: 0; margin: 0; }
.dish { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0.15rem 0; padding: 0.55rem 0; border-bottom: 1px solid var(--rule); }
.dish-name { font-size: 1.05rem; padding-right: 1rem; }
.dish-import-label { color: var(--rubric); font-style: italic; font-size: 0.95rem; }
.dish-price {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em;
  color: var(--ink-soft); white-space: nowrap;
  border-left: 1px solid var(--rule); padding-left: 1rem; min-width: 4.5rem; text-align: right;
}
.dish-desc { grid-column: 1 / -1; font-size: 0.9rem; font-style: italic; color: var(--ink-soft); line-height: 1.4; padding-right: 5.5rem; }
.menu-footer {
  margin-top: 2.4rem; text-align: center; font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.16em; font-size: 10px; color: var(--ink-faint);
}
.menu-footer::before { content: "\2766"; display: block; color: var(--rubric); font-size: 1rem; margin-bottom: 0.55rem; letter-spacing: 0; }

.ribbon-tabs, .mobile-actions { display: none; }

/* ---------- portrait: one page at a time, tabs + sticky bar ---------- */
@media (max-width: 640px) {
  .wrap { padding: 0 0.8rem calc(84px + env(safe-area-inset-bottom)); display: block; }
  .ribbon-tabs {
    display: flex; gap: 0.5rem; position: sticky; top: 0; z-index: 20;
    padding: 0.65rem 0.8rem 0; background: var(--desk);
  }
  .ribbon-tabs .tab {
    flex: 1; min-height: 46px; cursor: pointer;
    background: var(--page-warm); color: var(--ink-soft); border: 1px solid var(--rule); border-bottom: none;
    border-radius: 8px 8px 0 0; font-family: var(--serif); font-variant: small-caps;
    letter-spacing: 0.16em; font-size: 0.95rem;
  }
  .ribbon-tabs .tab[aria-selected="true"] { background: var(--page); color: var(--rubric); font-weight: 600; }
  .book { grid-template-columns: 1fr; border-radius: 0 0 8px 8px; box-shadow: 0 8px 30px rgba(40,25,5,0.2); }
  .book::before { display: none; }
  .page-l, .page-r { border-radius: 0 0 8px 8px; padding: 1.5rem 1.25rem 2rem; }
  body.show-params .page-r { display: none; }
  body:not(.show-params) .page-l { display: none; }
  .register-line { grid-template-columns: 88px 1fr auto; padding: 0.55rem 0; }
  select, input[type="text"] { min-height: 44px; }
  .lock-btn { width: 44px; height: 44px; }
  .flavor-pack-row { min-height: 46px; }
  .flavor-pack-row input { width: 20px; height: 20px; }
  .btn { min-height: 46px; }
  .mobile-actions {
    display: flex; gap: 0.5rem; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 0.6rem 0.9rem calc(0.6rem + env(safe-area-inset-bottom));
    background: var(--page-warm); border-top: 1px solid var(--rule);
  }
  .mobile-actions .btn { min-height: 48px; }
  .menu-header h2 { font-size: 2.1rem; }
  .dish-desc { padding-right: 0; }
  .theme-toggle { top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); right: 0.75rem; }
}

/* ---------- landscape phones: the natural spread, pages scroll inside ---------- */
@media (min-width: 641px) and (orientation: landscape) and (max-height: 520px) {
  .wrap { padding: 0.75rem 0.9rem; align-items: stretch; }
  .book { max-width: none; height: calc(100dvh - 1.5rem); overflow: hidden; }
  .page-l, .page-r { overflow-y: auto; height: 100%; padding: 1.1rem 1.4rem 1.1rem; }
  .page-head { margin-bottom: 0.9rem; }
  .page-l h1 { font-size: 1.25rem; }
  .register-line { padding: 0.3rem 0; grid-template-columns: 84px 1fr auto; }
  select, input[type="text"] { min-height: 40px; font-size: 15px; }
  .lock-btn { width: 40px; height: 40px; }
  .action-dock {
    position: sticky; bottom: -1.1rem; margin: 0.8rem -1.4rem -1.1rem; padding: 0.5rem 1.4rem 0.7rem;
    background: var(--page-warm); border-top: 1px solid var(--rule);
  }
  .action-dock .button-row { margin-top: 0; }
  .action-dock .button-row + .button-row { margin-top: 0.35rem; }
  .btn { min-height: 42px; }
  .menu-header h2 { font-size: 2rem; }
  .theme-toggle { top: 0.5rem; right: 0.5rem; width: 40px; height: 40px; }
}
@media (min-width: 641px) and (max-width: 930px) and (orientation: portrait) {
  .wrap { padding: 1.5rem 1rem 3rem; }
  .page-l, .page-r { padding: 1.75rem 1.5rem; }
  .register-line { grid-template-columns: 84px 1fr auto; }
}
</style>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z" />
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" />
  </svg>
</button>

<div class="ribbon-tabs" role="tablist" aria-label="Page">
  <button class="tab" id="tab-params" role="tab" aria-selected="false" type="button">Parameters</button>
  <button class="tab" id="tab-menu" role="tab" aria-selected="true" type="button">Inn menu</button>
</div>

<div class="wrap">
  <div class="book">
    <aside class="page-l">
      <div class="page-head">
        <h1>Inn Menu</h1>
        <p class="tagline">a system-agnostic inn menu generator</p>
      </div>

      <fieldset>
        <div class="register-line">
          <label for="biome">Biome</label>
          <select id="biome"></select>
        </div>
        <div class="register-line">
          <label for="season">Season</label>
          <select id="season"></select>
        </div>
        <div class="register-line">
          <label for="weather">Weather</label>
          <select id="weather"></select>
        </div>
        <div class="register-line">
          <label for="inn_tier">Inn tier</label>
          <select id="inn_tier">
            <option value="roadside">Roadside</option>
            <option value="common" selected>Common</option>
            <option value="fine">Fine</option>
            <option value="noble">Noble</option>
          </select>
        </div>
        <div class="register-line">
          <label for="economy">Economy</label>
          <select id="economy">
            <option value="plenty">Plenty</option>
            <option value="normal" selected>Normal</option>
            <option value="shortage">Shortage</option>
            <option value="famine">Famine</option>
          </select>
        </div>
        <div class="register-line">
          <label for="condition">Condition</label>
          <select id="condition"></select>
        </div>
        <div class="register-line">
          <label for="event">Event</label>
          <select id="event"></select>
        </div>
        <div class="register-line">
          <label for="seed">Seed</label>
          <input type="text" id="seed" placeholder="any-text" />
        </div>
      </fieldset>

      <fieldset id="flavor-packs-fieldset">
        <p class="packs-head">Flavor packs</p>
        <div class="flavor-packs" id="flavor-packs"></div>
      </fieldset>

      <div class="action-dock">
        <div class="button-row">
          <button class="btn primary" id="generate">Generate</button>
          <button class="btn" id="reroll">New seed</button>
        </div>
        <div class="button-row">
          <button class="btn" id="randomize">Randomize</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>

      <div class="polish-block">
        <div class="register-line">
          <label for="api-key">LLM polish</label>
          <input type="text" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
        </div>
        <p>Key stays in your browser. Sent only to api.anthropic.com.</p>
        <div class="button-row"><button class="btn" id="polish">Polish menu</button></div>
        <div id="polish-status"></div>
      </div>

      <p class="footnote">
        Edit data files on GitHub to change the content pool. See docs/DESIGN.md.
      </p>
    </aside>

    <main class="page-r" id="menu-output"></main>
  </div>
</div>

<div class="mobile-actions">
  <button class="btn primary" type="button" data-proxy="randomize">Randomize</button>
  <button class="btn" type="button" data-proxy="reroll">New seed</button>
</div>

<script src="src/generator.js"></script>
<script src="src/innname.js"></script>
<script src="src/llm.js"></script>
<script src="src/ui.js"></script>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    btn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  })();
</script>
<script>
  /* ===== BEGIN bound-codex layout JS =====
     Everything the redesign adds beyond the existing ui.js contract lives in
     this one block: portrait tab switching and the fixed mobile action bar
     that proxies clicks to the real Generate / New seed buttons. Deleting
     this block (and the matching markup above) removes the new behavior. */
  (function () {
    var tabParams = document.getElementById("tab-params");
    var tabMenu = document.getElementById("tab-menu");
    function setTab(showParams) {
      document.body.classList.toggle("show-params", showParams);
      tabParams.setAttribute("aria-selected", String(showParams));
      tabMenu.setAttribute("aria-selected", String(!showParams));
    }
    tabParams.addEventListener("click", function () { setTab(true); });
    tabMenu.addEventListener("click", function () { setTab(false); });

    // The bar's buttons regenerate the menu, so always land on the menu tab.
    document.querySelectorAll(".mobile-actions [data-proxy]").forEach(function (b) {
      b.addEventListener("click", function () {
        document.getElementById(b.dataset.proxy).click();
        setTab(false);
      });
    });

    // On portrait, jump to the menu page after generating so the result is visible.
    document.getElementById("generate").addEventListener("click", function () {
      if (window.matchMedia("(max-width: 640px)").matches) setTab(false);
    });
  })();
  /* ===== END bound-codex layout JS ===== */
</script>
</body>
</html>
